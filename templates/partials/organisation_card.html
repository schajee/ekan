{% load custom_tags %}
<div class="card border-light-subtle mb-4 h-100">
  <div class="card-body">
    <h5 class="card-title">
      <a class="stretched-link link-dark link-underline link-underline-opacity-0 link-underline-opacity-100-hover" href="{% url 'app:organisation' organisation.slug %}">{{ organisation.title }}</a>
    </h5>
    <p class="mb-0 small">{{ organisation.description|truncatewords:30 }}</p>
  </div>
  <div class="card-footer bg-transparent border-0 pt-0">
    <div class="d-flex justify-content-between align-items-center">
      <small class="text-muted">{{ organisation.datasets.count }} dataset{{ organisation.datasets.count|pluralize }}</small>
      {% if organisation|can_manage:user %}
        <i class="bi bi-person text-secondary" title="You can manage this organization"></i>
      {% endif %}
    </div>
  </div>
</div>

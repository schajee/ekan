{% if resource.format %}
{% if style == "link" %}
<a href="{% url 'app:resource' dataset_slug=resource.dataset.slug uuid=resource.id %}" class="badge bg-{{ resource.format.color }}-subtle border border-{{ resource.format.color }}-subtle text-{{ resource.format.color }}-emphasis text-decoration-none fw-semibold">
  {% if resource.file %}<i class="bi bi-file-earmark me-1"></i>{% elif resource.url %}<i class="bi bi-link-45deg me-1"></i>{% endif %}{{ resource.format|upper }}
</a>
{% else %}
<span class="badge bg-{{ resource.format.color }}-subtle border border-{{ resource.format.color }}-subtle text-{{ resource.format.color }}-emphasis fw-normal">
  {{ resource.format|upper }}
</span>
{% endif %}
{% else %}
<span class="badge text-bg-secondary text-decoration-none">
  UNKNOWN
</span>
{% endif %}

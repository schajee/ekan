{% load custom_tags %}
<div class="bg-white border-bottom">
  <div class="container">
    <nav class="navbar navbar-expand-lg">
      <a class="navbar-brand fw-bold" href="{% url 'app:home' %}">{% app_name %}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'app:datasets' %}">
              Datasets
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'app:organisations' %}">
              Organizations
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'app:topics' %}">
              Topics
            </a>
          </li>
        </ul>
        
        <ul class="navbar-nav ms-auto">
          {% if request.user.is_authenticated %}
          <!-- Show logged in user -->
          <span class="navbar-text">
            <i class="bi bi-person-circle me-1"></i>
            {{ request.user.username }}
          </span>
          <!-- Show manage link if user has access -->
          {% if request.user.is_staff %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'admin:index' %}">
              <i class="bi bi-gear me-1"></i>Manage
            </a>
          </li>
          {% endif %}
          <!-- Logout button -->
          <form id="form" method="post" action="{% url 'account_logout' %}" class="d-inline">
            {% csrf_token %}
            <a class="nav-link" href="#" onclick="this.closest('form').submit(); return false;">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
          </form>
          {% else %}
          <li class="nav-item">
            <a class="btn btn-success" href="{% url 'account_login' %}">
              Sign In
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </nav>
  </div>
</div>
